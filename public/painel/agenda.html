<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Painel de Agendamento</title>
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="topo"></div>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Agenda</h1>
      <p>Escolha a data para ver os horarios marcados.</p>
    </div>

    <div class="barra-filtros">
      <div class="campo">
        <label for="data">Data</label>
        <input type="date" id="data">
      </div>
      <button class="btn btn-primario" id="btnNovo"><i class="fas fa-plus"></i> Novo agendamento</button>
    </div>

    <div class="cartao">
      <h2><i class="fas fa-sliders"></i> Horarios que voce atende</h2>
      <p style="color:#6b6b7b;font-size:13.5px;margin:-8px 0 16px">
        Vale para todos os dias. Depois de salvar, a grade e a lista de horario do agendamento mudam juntos.
      </p>
      <div class="alerta" style="display:none" id="msgHor"></div>
      <div class="barra-filtros" style="margin-bottom:14px">
        <div class="campo">
          <label for="hIni">Comeca as</label>
          <input type="time" id="hIni" step="900">
        </div>
        <div class="campo">
          <label for="hFim">Termina as</label>
          <input type="time" id="hFim" step="900">
        </div>
        <div class="campo">
          <label for="hInterv">Intervalo</label>
          <select id="hInterv">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">1 hora</option>
            <option value="90">1h30</option>
          </select>
        </div>
        <button class="btn btn-primario" id="btnSalvarHor"><i class="fas fa-check"></i> Salvar</button>
        <button class="btn btn-secundario" id="btnPadraoHor">Padrao</button>
      </div>
      <div id="previaHor" class="grade-dia"></div>
    </div>

    <div class="cartao">
      <h2><i class="fas fa-clock"></i> Horarios do dia</h2>
      <div id="grade" class="carregando">Carregando...</div>
    </div>
  </main>

  <div id="modal" class="modal-fundo" hidden>
    <div class="modal">
      <h2>Novo agendamento</h2>
      <div id="modalMsg" class="alerta" style="display:none"></div>
      <div class="form-grid">
        <div class="form-linha col-2">
          <label for="mCliente">Cliente</label>
          <input type="text" id="mCliente" required>
        </div>
        <div class="form-linha">
          <label for="mTelefone">Telefone</label>
          <input type="text" id="mTelefone">
        </div>
        <div class="form-linha">
          <label for="mEmail">E-mail</label>
          <input type="email" id="mEmail">
        </div>
        <div class="form-linha col-2">
          <label for="mServico">Servico</label>
          <select id="mServico"></select>
        </div>
        <div class="form-linha">
          <label for="mData">Data</label>
          <input type="date" id="mData" required>
        </div>
        <div class="form-linha">
          <label for="mHora">Horario</label>
          <select id="mHora" required>
            <option value="">Selecione o horario</option>
          </select>
        </div>
        <div class="form-linha col-2">
          <label for="mObs">Observacoes</label>
          <textarea id="mObs" placeholder="Anotacoes internas"></textarea>
        </div>
      </div>
      <div class="modal-acoes">
        <button class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button class="btn btn-primario" id="btnSalvar"><i class="fas fa-check"></i> Salvar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { iniciarPagina, toast } from "./layout.js";
    import {
      listarAgendamentos, listarServicos, salvarAgendamento, definirStatus,
      lerHorarios, salvarHorarios, gerarSlots, HORARIOS_PADRAO,
      hojeISO, somarMinutos, escaparHtml, mensagemErro
    } from "./app.js";

    await iniciarPagina("agenda");
    let servicos = [];
    let horarios = await lerHorarios();

    const campoData = document.getElementById("data");
    const grade = document.getElementById("grade");
    const modal = document.getElementById("modal");
    const modalMsg = document.getElementById("modalMsg");

    /* ---- Controle de horarios: vale para todos os dias ---- */

    const hIni = document.getElementById("hIni");
    const hFim = document.getElementById("hFim");
    const hInterv = document.getElementById("hInterv");
    const previaHor = document.getElementById("previaHor");
    const msgHor = document.getElementById("msgHor");

    function mostrarHor(texto, tipo = "erro") {
      msgHor.style.display = "block";
      msgHor.className = "alerta alerta-" + tipo;
      msgHor.textContent = texto;
    }

    function pintarPrevia() {
      const slots = gerarSlots({
        horaInicio: hIni.value,
        horaFim: hFim.value,
        intervaloMin: hInterv.value
      });
      previaHor.innerHTML = slots.length
        ? slots.map((h) => `<div class="horario"><div class="h">${h}</div></div>`).join("")
        : `<div class="vazio"><i class="fas fa-ban"></i>Periodo invalido: o fim precisa ser depois do inicio.</div>`;
    }

    function preencherControle(cfg) {
      hIni.value = cfg.horaInicio;
      hFim.value = cfg.horaFim;
      hInterv.value = String(cfg.intervaloMin);
      pintarPrevia();
    }

    preencherControle(horarios);
    [hIni, hFim, hInterv].forEach((e) => e.addEventListener("change", pintarPrevia));

    document.getElementById("btnSalvarHor").onclick = async () => {
      msgHor.style.display = "none";
      if (!hIni.value || !hFim.value) return mostrarHor("Informe o inicio e o fim.");
      if (hFim.value <= hIni.value) return mostrarHor("O fim precisa ser maior que o inicio.");
      try {
        const cfg = { horaInicio: hIni.value, horaFim: hFim.value, intervaloMin: hInterv.value };
        await salvarHorarios(cfg);
        horarios = cfg;
        toast("Horarios atualizados para todos os dias.");
        pintar();
      } catch (e) {
        mostrarHor(mensagemErro(e));
      }
    };

    document.getElementById("btnPadraoHor").onclick = () => {
      preencherControle({ ...HORARIOS_PADRAO });
      mostrarHor("Mostrando 08:00 as 20:00, de 30 em 30 min. Clique em Salvar para confirmar.", "info");
    };

    /* ---- Agenda ---- */

    campoData.value = hojeISO();
    servicos = await listarServicos();

    document.getElementById("mServico").innerHTML =
      '<option value="">Selecione um servico</option>' +
      servicos.map((s) => `<option value="${escaparHtml(s.id)}">${escaparHtml(s.nome)} (${s.duracaoMin}min)</option>`).join("");

    async function pintar() {
      const data = campoData.value || hojeISO();
      grade.innerHTML = '<div class="carregando">Carregando...</div>';
      const lista = (await listarAgendamentos({ data })).filter((a) => a.status !== "cancelado");

      grade.innerHTML = `<div class="grade-dia">${gerarSlots(horarios).map((h) => {
        const ag = lista.find((a) => a.horaInicio === h);
        if (!ag) return `<div class="horario"><div class="h">${h}</div><div class="c">Livre</div></div>`;
        return `<div class="horario ocupado">
            <div class="h">${h}</div>
            <div class="c">${escaparHtml(ag.clienteNome)}<br>${escaparHtml(ag.servicoNome || "")}</div>
            <div class="s">${escaparHtml(ag.status)}</div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              ${ag.status === "pendente" ? `<button class="btn btn-sucesso btn-sm" data-confirmar="${ag.id}">Confirmar</button>` : ""}
              <button class="btn btn-perigo btn-sm" data-cancelar="${ag.id}">Cancelar</button>
            </div>
          </div>`;
      }).join("")}</div>`;

      grade.querySelectorAll("[data-confirmar]").forEach((b) =>
        b.onclick = async () => { await definirStatus(b.dataset.confirmar, "confirmado"); toast("Agendamento confirmado."); pintar(); }
      );
      grade.querySelectorAll("[data-cancelar]").forEach((b) =>
        b.onclick = async () => { await definirStatus(b.dataset.cancelar, "cancelado"); toast("Agendamento cancelado.", "aviso"); pintar(); }
      );
    }

    campoData.addEventListener("change", pintar);
    pintar();

    async function preencherHorarios(data) {
      const lista = (await listarAgendamentos({ data })).filter((a) => a.status !== "cancelado");
      const ocupados = new Set(lista.map((a) => a.horaInicio));
      const sel = document.getElementById("mHora");
      const anterior = sel.value;

      sel.innerHTML = '<option value="">Selecione o horario</option>' +
        gerarSlots(horarios).map((h) => `
          <option value="${h}" ${ocupados.has(h) ? "disabled" : ""}>
            ${h}${ocupados.has(h) ? " - ocupado" : ""}
          </option>`).join("");

      if (anterior && !ocupados.has(anterior)) sel.value = anterior;
    }

    document.getElementById("btnNovo").addEventListener("click", async () => {
      modal.hidden = false;
      modalMsg.style.display = "none";
      document.getElementById("mData").value = campoData.value || hojeISO();
      await preencherHorarios(document.getElementById("mData").value || hojeISO());
    });

    document.getElementById("mData").addEventListener("change", (e) => preencherHorarios(e.target.value));

    document.getElementById("btnCancelar").addEventListener("click", () => { modal.hidden = true; });

    document.getElementById("btnSalvar").addEventListener("click", async () => {
      const aviso = (t, k = "erro") => {
        modalMsg.style.display = "block";
        modalMsg.className = "alerta alerta-" + k;
        modalMsg.textContent = t;
      };

      const cliente = document.getElementById("mCliente").value.trim();
      const data = document.getElementById("mData").value;
      const hora = document.getElementById("mHora").value;
      if (!cliente || !data || !hora) return aviso("Preencha cliente, data e horario.");

      const servicoId = document.getElementById("mServico").value;
      const servico = servicos.find((s) => s.id === servicoId);

      const jaExiste = (await listarAgendamentos({ data }))
        .filter((a) => a.status !== "cancelado")
        .find((a) => a.horaInicio === hora);
      if (jaExiste) return aviso("Este horario ja esta ocupado. Escolha outro.");

      const ag = {
        clienteNome: cliente,
        clienteTelefone: document.getElementById("mTelefone").value.trim(),
        clienteEmail: document.getElementById("mEmail").value.trim(),
        servicoId,
        servicoNome: servico ? servico.nome : "",
        data,
        horaInicio: hora,
        horaFim: somarMinutos(hora, servico ? servico.duracaoMin : 60),
        status: "pendente",
        valor: servico ? servico.preco : 0,
        observacoes: document.getElementById("mObs").value.trim()
      };

      try {
        await salvarAgendamento(ag);
        modal.hidden = true;
        toast("Agendamento criado.");
        pintar();
      } catch (e) {
        aviso(mensagemErro(e));
      }
    });
  </script>
</body>
</html>
