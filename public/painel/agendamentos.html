<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos | Painel de Agendamento</title>
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="topo"></div>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Agendamentos</h1>
      <p>Todos os consultations com filtros e status.</p>
    </div>

    <div class="barra-filtros">
      <div class="campo">
        <label for="fData">Data</label>
        <input type="date" id="fData">
      </div>
      <div class="campo">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluido</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <button class="btn btn-primario" id="btnBuscar"><i class="fas fa-filter"></i> Filtrar</button>
      <button class="btn btn-secundario" id="btnLimpar">Limpar</button>
    </div>

    <div id="solic" class="carregando">Carregando...</div>

    <div id="tabela" class="carregando">Carregando...</div>
  </main>

  <script type="module">
    import { iniciarPagina, toast } from "./layout.js";
    import {
      listarAgendamentos, definirStatus, excluirAgendamento, salvarAgendamento,
      listarSolicitacoes, resolverSolicitacao, somarMinutos,
      mensagemConfirmacao, linkWhatsApp, enviarEmailConfirmacao, emailConfigurado,
      formatarDataBR, formatarMoeda, escaparHtml, mensagemErro
    } from "./app.js";

    await iniciarPagina("agendamentos");
    const tabela = document.getElementById("tabela");
    const boxSolic = document.getElementById("solic");

    /** Avisa se o e-mail automatico esta ativo. */
    if (!emailConfigurado()) {
      const aviso = document.createElement("div");
      aviso.className = "alerta alerta-aviso";
      aviso.style.marginBottom = "16px";
      aviso.innerHTML = "<strong>E-mail automatico desativado.</strong> Configure a chave em <code>config.js</code> para enviar confirmacoes.";
      document.querySelector(".conteudo").prepend(aviso);
    }

    /** Envia o e-mail e avisa o resultado. */
    async function avisarPorEmail(ag, tipo) {
      const r = await enviarEmailConfirmacao(ag, tipo);
      if (r.motivo === "nao-configurado") return;
      if (r.motivo === "sem-email") { toast("Agendamento sem e-mail: nao foi possivel avisar.", "aviso"); return; }
      toast(r.ok ? "E-mail de confirmacao enviado." : "Falha ao enviar o e-mail.", r.ok ? "ok" : "erro");
    }

    /* ---- Pedidos do cliente ---- */

    async function carregarSolicitacoes() {
      boxSolic.innerHTML = '<div class="carregando">Carregando pedidos...</div>';
      let lista = [];
      try {
        lista = (await listarSolicitacoes()).filter((s) => s.status === "pendente");
      } catch (e) {
        boxSolic.innerHTML = `<div class="alerta alerta-erro">${escaparHtml(mensagemErro(e))}</div>`;
        return;
      }

      boxSolic.style.display = lista.length ? "block" : "none";
      if (!lista.length) return;

      boxSolic.innerHTML = `
        <div class="cartao">
          <h2><i class="fas fa-bell"></i> Pedidos dos clientes (${lista.length})</h2>
          <div class="tabela-envolve"><table>
            <thead><tr><th>Cliente</th><th>Tipo</th><th>Atual</th><th>Pedido</th><th>Motivo</th><th></th></tr></thead>
            <tbody>
              ${lista.map((s) => `
                <tr>
                  <td><strong>${escaparHtml(s.clienteNome || "-")}</strong><br>
                      <small style="color:#6b6b7b">${escaparHtml(s.clienteEmail || "")}</small></td>
                  <td><span class="etiqueta etiqueta-${s.tipo === "cancelamento" ? "cancelado" : "pendente"}">${escaparHtml(s.tipo)}</span></td>
                  <td>${formatarDataBR(s.dataAtual)}<br>${escaparHtml(s.horaAtual)}</td>
                  <td>${s.tipo === "cancelamento" ? "<span style='color:#6b6b7b'>cancelar</span>" :
                        `${formatarDataBR(s.dataNova)}<br>${escaparHtml(s.horaNova)}`}</td>
                  <td>${escaparHtml(s.motivo || "-")}</td>
                  <td>
                    <div class="acoes">
                      <button class="btn btn-sucesso btn-sm" data-aprovar="${s.id}" data-tipo="${s.tipo}" data-ag="${s.agendamentoId}" data-nd="${s.dataNova || ""}" data-nh="${s.horaNova || ""}">Aprovar</button>
                      <button class="btn btn-secundario btn-sm" data-recusar="${s.id}">Recusar</button>
                    </div>
                  </td>
                </tr>`).join("")}
            </tbody>
          </table></div>
        </div>`;

      boxSolic.querySelectorAll("[data-aprovar]").forEach((b) =>
        b.onclick = async () => {
          try {
            const agId = b.dataset.ag;
            const alvo = (await listarAgendamentos({})).find((a) => a.id === agId);

            if (b.dataset.tipo === "cancelamento") {
              await definirStatus(agId, "cancelado");
              toast("Cancelamento aprovado.");
              await avisarPorEmail(alvo, "cancelamento");
            } else {
              const dia = (await listarAgendamentos({ data: b.dataset.nd }))
                .filter((a) => a.status !== "cancelado");
              if (dia.some((a) => a.horaInicio === b.dataset.nh)) {
                return toast("Esse horario ja esta ocupado. Recuse e escolha outro.", "erro");
              }
              const original = (await listarAgendamentos({})).find((a) => a.id === agId);
              if (!original) return toast("Agendamento nao encontrado.", "erro");
              const duracao = Math.max(
                15,
                (Number(original.horaFim?.slice(0, 2)) * 60 + Number(original.horaFim?.slice(3, 5)))
                - (Number(original.horaInicio?.slice(0, 2)) * 60 + Number(original.horaInicio?.slice(3, 5)))
              );
              await salvarAgendamento({
                id: agId,
                clienteNome: original.clienteNome,
                clienteTelefone: original.clienteTelefone,
                clienteEmail: original.clienteEmail,
                servicoId: original.servicoId,
                servicoNome: original.servicoNome,
                data: b.dataset.nd,
                horaInicio: b.dataset.nh,
                horaFim: somarMinutos(b.dataset.nh, duracao),
                status: original.status,
                valor: original.valor,
                observacoes: original.observacoes
              });
              toast("Alteracao aprovada.");
              await avisarPorEmail(
                { ...original, data: b.dataset.nd, horaInicio: b.dataset.nh },
                "alteracao"
              );
            }
            await resolverSolicitacao(b.dataset.aprovar, "aprovada");
            carregarSolicitacoes();
            carregar();
          } catch (e) {
            toast(mensagemErro(e), "erro");
          }
        }
      );

      boxSolic.querySelectorAll("[data-recusar]").forEach((b) =>
        b.onclick = async () => {
          if (!confirm("Recusar este pedido?")) return;
          try {
            await resolverSolicitacao(b.dataset.recusar, "recusada");
            toast("Pedido recusado.");
            carregarSolicitacoes();
          } catch (e) {
            toast(mensagemErro(e), "erro");
          }
        }
      );
    }

    carregarSolicitacoes();

    async function carregar() {
      tabela.innerHTML = '<div class="carregando">Carregando...</div>';
      const data = document.getElementById("fData").value;
      const status = document.getElementById("fStatus").value;

      let lista = await listarAgendamentos({ data: data || undefined, status: status || undefined });
      lista.sort((a, b) => (b.data + b.horaInicio).localeCompare(a.data + a.horaInicio));

      if (!lista.length) {
        tabela.innerHTML = '<div class="cartao"><div class="vazio"><i class="fas fa-inbox"></i>Nenhum agendamento encontrado.</div></div>';
        return;
      }

      tabela.innerHTML = `
        <div class="tabela-envolve"><table>
          <thead><tr>
            <th>Data</th><th>Hora</th><th>Cliente</th><th>Contato</th>
            <th>Servico</th><th>Valor</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>
            ${lista.map((a) => `
              <tr>
                <td>${formatarDataBR(a.data)}</td>
                <td>${escaparHtml(a.horaInicio)}</td>
                <td><strong>${escaparHtml(a.clienteNome)}</strong></td>
                <td>
                  ${a.clienteTelefone ? `<a class="link-suave" target="_blank" rel="noopener" href="https://wa.me/55${escaparHtml(a.clienteTelefone.replace(/\D/g, ""))}">${escaparHtml(a.clienteTelefone)}</a>` : "-"}
                </td>
                <td>${escaparHtml(a.servicoNome || "-")}</td>
                <td>${formatarMoeda(a.valor)}</td>
                <td><span class="etiqueta etiqueta-${escaparHtml(a.status)}">${escaparHtml(a.status)}</span></td>
                <td>
                  <div class="acoes">
                    ${a.status === "pendente" ? `<button class="btn btn-sucesso btn-sm" data-st="${a.id}" data-valor="confirmado">Confirmar</button>` : ""}
                    ${a.status === "confirmado" ? `<button class="btn btn-secundario btn-sm" data-st="${a.id}" data-valor="concluido">Concluir</button>` : ""}
                    <button class="btn btn-sucesso btn-sm" data-zap="${a.id}"><i class="fab fa-whatsapp"></i> Confirmar</button>
                    <button class="btn btn-perigo btn-sm" data-del="${a.id}">Excluir</button>
                  </div>
                </td>
              </tr>`).join("")}
          </tbody>
        </table></div>`;

      tabela.querySelectorAll("[data-st]").forEach((b) =>
        b.onclick = async () => {
          const alvo = lista.find((x) => x.id === b.dataset.st);
          await definirStatus(b.dataset.st, b.dataset.valor);
          toast("Status atualizado.");
          carregar();
          // dispara o e-mail automatico na confirmacao
          if (b.dataset.valor === "confirmado" && alvo) {
            await avisarPorEmail({ ...alvo, status: "confirmado" }, "confirmacao");
          }
        }
      );

      tabela.querySelectorAll("[data-zap]").forEach((b) =>
        b.onclick = () => {
          const ag = lista.find((x) => x.id === b.dataset.zap);
          if (!ag) return;
          const texto = mensagemConfirmacao(ag);
          window.open(linkWhatsApp(ag, texto), "_blank", "noopener");
        }
      );

      tabela.querySelectorAll("[data-del]").forEach((b) =>
        b.onclick = async () => {
          if (!confirm("Excluir este agendamento?")) return;
          try {
            await excluirAgendamento(b.dataset.del);
            toast("Agendamento excluido.");
            carregar();
          } catch (e) {
            toast(mensagemErro(e), "erro");
          }
        }
      );
    }

    document.getElementById("btnBuscar").onclick = carregar;
    document.getElementById("fStatus").onchange = carregar;
    document.getElementById("btnLimpar").onclick = () => {
      document.getElementById("fData").value = "";
      document.getElementById("fStatus").value = "";
      carregar();
    };

    carregar();
  </script>
</body>
</html>
