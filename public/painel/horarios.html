<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios | Painel de Agendamento</title>
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="topo"></div>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Horarios de atendimento</h1>
      <p>Defina os horarios e os dias que aparecem na agenda.</p>
    </div>

    <div class="cartao">
      <h2><i class="fas fa-clock"></i> Periodo</h2>

      <div class="alerta alerta-info" style="display:none" id="msg"></div>

      <div class="form-grid">
        <div class="form-linha">
          <label for="hIni">Comeca as</label>
          <input type="time" id="hIni" step="900" value="08:00">
        </div>
        <div class="form-linha">
          <label for="hFim">Termina as</label>
          <input type="time" id="hFim" step="900" value="20:00">
        </div>
        <div class="form-linha col-2">
          <label for="intervalo">Intervalo entre horarios</label>
          <select id="intervalo">
            <option value="15">15 minutos</option>
            <option value="30">30 minutos</option>
            <option value="45">45 minutos</option>
            <option value="60">1 hora</option>
            <option value="90">1 hora e 30</option>
          </select>
        </div>
      </div>

      <div class="form-linha">
        <label style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="ativo" checked style="width:auto"> Mostrar agenda somente nesses dias
        </label>
      </div>
    </div>

    <div class="cartao">
      <h2><i class="fas fa-calendar-week"></i> Dias da semana</h2>
      <div id="dias" class="grade-dia"></div>
      <small style="color:#6b6b7b">Clique nos dias para ligar ou desligar.</small>
    </div>

    <div class="cartao">
      <h2><i class="fas fa-eye"></i> Pre-visualizacao</h2>
      <div id="preview" class="grade-dia"></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primario" id="btnSalvar"><i class="fas fa-check"></i> Salvar horarios</button>
      <button class="btn btn-secundario" id="btnPadrao">Voltar ao padrao</button>
    </div>
  </main>

  <script type="module">
    import { iniciarPagina, toast } from "./layout.js";
    import {
      lerConfiguracaoHorarios, salvarConfiguracaoHorarios,
      CONFIG_PADRAO, gerarSlots, mensagemErro
    } from "./app.js";

    await iniciarPagina("horarios");

    const DIAS = [
      { v: 0, n: "Domingo" },
      { v: 1, n: "Segunda" },
      { v: 2, n: "Terca" },
      { v: 3, n: "Quarta" },
      { v: 4, n: "Quinta" },
      { v: 5, n: "Sexta" },
      { v: 6, n: "Sabado" }
    ];

    const el = {
      ini: document.getElementById("hIni"),
      fim: document.getElementById("hFim"),
      intervalo: document.getElementById("intervalo"),
      ativo: document.getElementById("ativo"),
      dias: document.getElementById("dias"),
      preview: document.getElementById("preview"),
      msg: document.getElementById("msg")
    };

    let selecionados = new Set(CONFIG_PADRAO.diasSemana);

    function aviso(texto, tipo = "erro") {
      el.msg.style.display = "block";
      el.msg.className = "alerta alerta-" + tipo;
      el.msg.textContent = texto;
    }

    function pintarDias() {
      el.dias.innerHTML = DIAS.map((d) => `
        <button type="button" class="horario ${selecionados.has(d.v) ? "ocupado" : ""}" data-dia="${d.v}">
          <div class="h">${d.n}</div>
          <div class="c">${selecionados.has(d.v) ? "Atendimento" : "Fechado"}</div>
        </button>`).join("");

      el.dias.querySelectorAll("[data-dia]").forEach((b) => {
        b.onclick = () => {
          const v = Number(b.dataset.dia);
          if (selecionados.has(v)) selecionados.delete(v);
          else selecionados.add(v);
          pintarDias();
          pintarPreview();
        };
      });
    }

    function pintarPreview() {
      const slots = gerarSlots({
        horaInicio: el.ini.value,
        horaFim: el.fim.value,
        intervaloMin: el.intervalo.value
      });
      el.preview.innerHTML = slots.length
        ? slots.map((h) => `<div class="horario"><div class="h">${h}</div></div>`).join("")
        : `<div class="vazio"><i class="fas fa-ban"></i>Periodo invalido: o fim precisa ser depois do inicio.</div>`;
    }

    [el.ini, el.fim, el.intervalo].forEach((e) => e.addEventListener("change", pintarPreview));

    function preencher(cfg) {
      el.ini.value = cfg.horaInicio;
      el.fim.value = cfg.horaFim;
      el.intervalo.value = String(cfg.intervaloMin);
      el.ativo.checked = cfg.ativo !== false;
      selecionados = new Set(cfg.diasSemana || []);
      pintarDias();
      pintarPreview();
    }

    preencher(await lerConfiguracaoHorarios());

    document.getElementById("btnSalvar").onclick = async () => {
      el.msg.style.display = "none";
      if (el.fim.value <= el.ini.value) {
        return aviso("O horario de fim precisa ser maior que o de inicio.");
      }
      if (selecionados.size === 0) {
        return aviso("Escolha pelo menos um dia de atendimento.");
      }
      try {
        await salvarConfiguracaoHorarios({
          horaInicio: el.ini.value,
          horaFim: el.fim.value,
          intervaloMin: el.intervalo.value,
          diasSemana: [...selecionados].sort((a, b) => a - b),
          ativo: el.ativo.checked
        });
        toast("Horarios atualizados. A agenda ja usa essa configuracao.");
      } catch (e) {
        aviso(mensagemErro(e));
      }
    };

    document.getElementById("btnPadrao").onclick = () => {
      preencher({ ...CONFIG_PADRAO });
      aviso("Exibindo os valores padrao. Clique em Salvar para confirmar.", "info");
    };
  </script>
</body>
</html>
