<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Painel Agendamento</title>
  <link rel="stylesheet" href="../painel.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="login-wrap">
    <form id="loginForm" class="login-cartao" novalidate>
      <div class="login-marca"><i class="fas fa-calendar-check"></i> Painel de Agendamento</div>
      <h2 style="text-align:center">Entrar no painel</h2>
      <div id="msg" class="alerta" style="display:none"></div>
      <div class="form-linha">
        <label>E-mail
          <input type="email" id="email" required placeholder="seu@email.com">
        </label>
      </div>
      <div class="form-linha">
        <label>Senha
          <input type="password" id="senha" required placeholder="Senha">
        </label>
      </div>
      <button class="btn btn-primario" type="submit"><i class="fas fa-right-to-bracket"></i> Entrar</button>
      <a class="btn" href="cadastro.html"><i class="fas fa-user-plus"></i> Criar conta</a>
      <a class="btn" href="../" style="text-align:center;text-decoration:none;display:block"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    onAuthStateChanged(auth, u => { if (u) window.location.href = "dashboard.html"; });
    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const msg = document.getElementById("msg");
      try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = "dashboard.html";
      } catch (err) {
        msg.style.display = "block";
        msg.className = "alerta alerta-erro";
        msg.textContent = "E-mail ou senha inválidos.";
      }
    });
  </script>
</body>
</html>
